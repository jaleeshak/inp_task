name: Build iOS app (unsigned .ipa)

# Builds on a real cloud Mac provided by GitHub. The .ipa is UNSIGNED on
# purpose: Sideloadly / AltStore on your Windows PC signs it with your own
# Apple ID when installing it on your iPhone.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project from project.yml
        run: xcodegen generate

      - name: Build (Release, device, no signing)
        run: |
          xcodebuild \
            -project Innovoprism.xcodeproj \
            -scheme Innovoprism \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Innovoprism.app Payload/
          zip -qry Innovoprism.ipa Payload
          ls -lh Innovoprism.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Innovoprism-ipa
          path: Innovoprism.ipa
          retention-days: 14
